name: Bug report
description: Report a reproducible CEXLENS defect without exposing private data
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes: {label: Platform, options: [Windows 11, Linux, Other]}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include sanitized commands and error classifications; never include API keys or raw public IPs.}
    validations: {required: true}

