[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cex-latency-platform"
version = "0.2.0"
description = "Auditable public-endpoint latency intelligence for centralized exchanges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12,<16",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "plotly>=5.22,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
cexlatency = "cexlatency.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cexlatency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["live: conservative opt-in tests against public exchange endpoints"]
